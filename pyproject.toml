# uv workspace root. It is not a package itself; members live in services/ and tools/, plus the
# solver's Python bindings (built by maturin from crates/kinematics-py).
[tool.uv.workspace]
members = ["services/*", "tools/*", "crates/kinematics-py"]

[dependency-groups]
dev = [
  "ruff==0.17.5",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "hypothesis==6.170.15",
  "datamodel-code-generator==0.94.0",
]

[tool.uv]
required-version = "==0.13.8"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/generated/**", ".kiro", "crates/kinematics-py/python/orrery_kinematics/_native"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT", "TID", "ANN", "BLE", "C4", "PERF"]
ignore = ["PLR0913"]
# Mechanism docs use mathematical notation: minus signs, en dashes in names (Peaucellier–Lipkin),
# and Greek letters for angles.
allowed-confusables = ["−", "–", "α", "μ", "θ", "ψ", "σ"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S603", "S607", "PLR2004", "ANN"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["services", "tools", "crates/kinematics-py"]
exclude = ["**/generated/**", "**/.venv/**", "**/node_modules/**"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["services", "tools", "crates/kinematics-py/tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
