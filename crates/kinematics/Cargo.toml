[package]
name = "kinematics"
version = "0.1.0"
description = "Orrery's mechanism solver: assembly, simulation, analysis, and fitting."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
parry2d-f64 = { version = "0.31.1", default-features = false, features = ["std", "dim2", "f64", "enhanced-determinism"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"

[lints]
workspace = true
