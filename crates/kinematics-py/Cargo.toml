[package]
name = "kinematics-py"
version = "0.1.0"
description = "Python bindings of Orrery's mechanism solver (the orrery_kinematics module)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kinematics_py"
# cdylib for the extension module, rlib for the stub generator binary.
crate-type = ["cdylib", "rlib"]
# The bindings are tested from Python (tests/); a Rust test binary would need libpython at run time.
test = false
doctest = false

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
test = false

# No `extension-module` feature: maturin sets PYO3_BUILD_EXTENSION_MODULE for the wheel, and the
# stub generator binary must link libpython.
[dependencies]
kinematics = { path = "../kinematics" }
numpy = "0.30.0"
pyo3 = "0.30.1"
pyo3-stub-gen = "0.23.2"
serde_json = "1.0.154"

[lints]
workspace = true
