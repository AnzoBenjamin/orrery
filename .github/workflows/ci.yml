name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and tests (toolbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Host UID and GID for the toolbox user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same Dockerfile and image tag that `make toolbox` produces locally, with a layer cache.
      - name: Build toolbox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/toolbox
          tags: orrery-toolbox:local
          load: true
          build-args: |
            UID=${{ env.HOST_UID }}
            GID=${{ env.HOST_GID }}
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,scope=toolbox,mode=max

      - name: make check
        run: make check TOOLBOX_PREBUILT=1

      - name: make test
        run: make test TOOLBOX_PREBUILT=1
