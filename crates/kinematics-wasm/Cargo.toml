[package]
name = "kinematics-wasm"
version = "0.1.0"
description = "WebAssembly bindings of Orrery's mechanism solver, for the browser's solver worker."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.107"
kinematics = { path = "../kinematics" }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"

[package.metadata.wasm-pack.profile.release]
# The toolbox has no network access to fetch binaryen; LTO and opt-level 3 do the size work.
wasm-opt = false

[lints]
workspace = true
