[project]
name = "orrery-lab"
version = "0.1.0"
description = "Orrery's synthetic lab: generated mechanisms with ground truth, renders, and scoring."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3==1.44.12",
    "bpy==5.3.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "orrery-kinematics",
    "pyarrow==23.0.1",
    "pydantic==2.14.3",
    "skia-python==144.1",
    "typer==0.29.1",
]

[project.scripts]
orrery-lab = "orrery_lab.cli:app"

[tool.uv.sources]
orrery-kinematics = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
